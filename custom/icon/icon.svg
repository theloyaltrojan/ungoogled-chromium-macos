<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Body: the Island toolbar slate fading into the black frame -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2128"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <!-- Dot grid from the ASCII new tab -->
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse" x="12" y="12">
      <circle cx="17" cy="17" r="2.6" fill="#6ee6ff" fill-opacity=".16"/>
    </pattern>
    <radialGradient id="glow" cx=".5" cy=".55" r=".5">
      <stop offset="0" stop-color="#6ee6ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#6ee6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262b33"/>
      <stop offset="1" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".03"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- macOS icon grid: 824px squircle centred on a 1024 canvas -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)"/>
  </g>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#dots)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- The floating Island pill -->
  <g filter="url(#shadow)">
    <rect x="212" y="392" width="600" height="240" rx="120" fill="url(#pill)"/>
  </g>
  <rect x="213.5" y="393.5" width="597" height="237" rx="118.5" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="3"/>

  <!-- >_ prompt -->
  <g filter="url(#neon)" stroke="#6ee6ff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M330 450 L420 512 L330 574"/>
    <path d="M470 574 H590"/>
  </g>

  <!-- Tor: onion rings, purple -->
  <g transform="translate(704 512)" fill="none" stroke="#b67cff" stroke-linecap="round">
    <circle r="44" stroke-width="12"/>
    <circle r="24" stroke-width="10" stroke-opacity=".85"/>
    <circle r="7" fill="#b67cff" stroke="none"/>
  </g>
</svg>
